interface:
  display_name: "Paper Reviewer"
  short_description: "Auditable paper review with close-reading ledger, NeurIPS JSON, and concise feedback"
  default_prompt: "Use $paper-reviewer within the requested scope. Inspect PDF page images, validate the in-scope close-reading ledger, and report excluded coverage. Apply SKILL.md with the user's selected same-type published papers as >=6 anchors and selected, fully reviewed cover exemplars as 10 anchors; use the same scale for the manuscript. Retain demonstrated errors and explain calibration conflicts rather than forcing scores by identity. Tie blockers to a claim or requirement, location, evidence, and consequence; separate optional improvements. Produce review JSON and a concise review, then stop when complete. External model review needs separate approval and the existing review_executor.py ledger."
