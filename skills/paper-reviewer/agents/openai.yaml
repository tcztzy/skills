interface:
  display_name: "Paper Reviewer"
  short_description: "Auditable paper review with close-reading ledger, NeurIPS JSON, and concise feedback"
  default_prompt: "When the input is a PDF, render page images first and inspect them directly for layout, typography, figures, tables, charts, and caption alignment. Before scoring, prepare and validate close_reading_audit.jsonl plus coverage_map.json, identify the target venue and ISSN, and use any matching journal reference and public calibration cache under ~/.paper-reviewer. Apply the evidence-based, venue-calibrated 1-10 anchors in SKILL.md: score fatality and claim impact rather than criticism count, treat 6 as the minimum publishable venue standard, and require top-end intrinsic contribution and evidence for 10. Justify the provisional score without using publication or cover status, then run the status post-validators and resolve any failure by comparative re-review rather than automatic score clamping. Then produce both a NeurIPS-style review JSON and a concise evidence-linked review summary with prioritized recommendations."
