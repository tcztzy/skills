interface:
  display_name: "Paper Writer"
  short_description: "Draft papers and journal scaffolds from research evidence"
  default_prompt: "Use $paper-writer to draft, revise, or scaffold a scientific paper from supplied evidence. Choose the requested format; journal scaffolds need current publisher checks before submission. Tie blockers to central claims or agreed acceptance, run necessary feasible local analyses within scope, and keep optional experiments separate. Compare prior work fairly and check claims, figures, citations, and formatting. Deliver once acceptance is met; recheck affected material after a fix. Use paper-reviewer with the user's selected comparable published controls for scoring. External model review needs separate approval and the existing review_executor.py ledger."
