interface:
  display_name: "Paper Writer"
  short_description: "Draft papers and journal scaffolds from research evidence"
  default_prompt: "Use $paper-writer to draft, revise, or scaffold a scientific paper from ideas, summaries, plots, citations, and experiment artifacts. Choose the conference, ICBINB, or journal scaffold that matches the request; journal scaffolds are drafts, and current publisher requirements must be checked before submission. Keep claims grounded in evidence, and when the draft is blocked by a missing but feasible piece of support, actively recommend the smallest decisive supplementary experiment and run simple statistics or lightweight analyses directly when local artifacts already make that possible. Use the bundled bibliography helper only for manuscript-local citation gaps, route Zotero library or collection management elsewhere, compare the closest prior work fairly, keep the title and abstract concise and proportionate, and ensure figure/caption readability, submission-readiness, and LaTeX quality."
