interface:
  display_name: "Skill Manager"
  short_description: "Review skill scope, useful guidance, and overlap"
  default_prompt: "Use $skill-manager to review the named skills against actual tasks and available instructions. Recommend what to keep, narrow, merge, remove, or move to an ordinary command, with evidence and possible losses. Count reliable enforcement of user requirements as useful guidance even when the steps are deterministic. Apply only authorized changes and report the checks performed."
