name: Validate skills

on: [push, pull_request]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: scripts/test-requirements.txt

      - name: Validate plugin metadata
        run: python scripts/validate_plugin_metadata.py

      - name: Check release version against the base revision
        if: >-
          github.event_name == 'pull_request' ||
          (github.ref_name == github.event.repository.default_branch &&
           github.event.before && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_plugin_release.py --base "$BASE_REVISION"

      - name: Install Python test dependencies
        run: python -m pip install --requirement scripts/test-requirements.txt

      - name: Check Python style
        run: ruff check .

      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: "3.13"

      - name: Install LaTeX classes for the journal scaffold tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-publishers

      - name: Test repository tools and bundled skills
        run: python scripts/run_tests.py

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"

      - run: python scripts/validate_plugin_metadata.py
      - run: python scripts/run_tests.py --core
